name: Sync Source to Target and Close PRs

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository (username/repo)'
        required: true
        default: 'markqloudx/databricks-poc-dev'
      branch:
        description: 'Branch to sync'
        required: true
        default: 'main'
      pr_number:
        description: 'PR number to merge and close'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      # ============================================================
      # STEP 1: Merge PR in SOURCE repo (DEV)
      # ============================================================
      
      - name: Merge PR in SOURCE repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔀 Attempting to merge PR #${{ github.event.inputs.pr_number }} in ${{ github.event.inputs.source_repo }}"
          
          # First check if PR exists and is mergeable
          PR_INFO=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.event.inputs.source_repo }} --json mergeable,state 2>/dev/null || echo "not_found")
          
          if [[ "$PR_INFO" == "not_found" ]]; then
            echo "⚠️ PR #${{ github.event.inputs.pr_number }} not found in source repo. Skipping merge."
          else
            # Merge the PR
            gh pr merge ${{ github.event.inputs.pr_number }} \
              --repo ${{ github.event.inputs.source_repo }} \
              --merge --admin || echo "⚠️ Merge failed or already merged"
            echo "✅ PR merge attempted in SOURCE repo!"
          fi
      
      # ============================================================
      # STEP 2: Sync Source → Target
      # ============================================================
      
      - name: Add source repo as remote
        run: |
          git remote add source https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.event.inputs.source_repo }}.git
          git fetch source ${{ github.event.inputs.branch }} || echo "⚠️ Could not fetch source"
      
      - name: Merge source into target
        run: |
          git checkout ${{ github.event.inputs.branch }}
          echo "🔄 Merging from source to target..."
          git merge source/${{ github.event.inputs.branch }} --allow-unrelated-histories -m "Sync from ${{ github.event.inputs.source_repo }}" || echo "⚠️ Merge had issues"
      
      - name: Push merged code to target
        run: |
          git push origin ${{ github.event.inputs.branch }} || echo "⚠️ Push failed"
          echo "✅ Sync attempted to target!"
      
      # ============================================================
      # STEP 3: Close PR in TARGET repo (PROD)
      # ============================================================
      
      - name: Close PR in TARGET repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔒 Attempting to close PR #${{ github.event.inputs.pr_number }} in TARGET repo"
          
          # Check if PR exists in target repo
          PR_EXISTS=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --json number 2>/dev/null || echo "not_found")
          
          if [[ "$PR_EXISTS" == "not_found" ]]; then
            echo "⚠️ PR #${{ github.event.inputs.pr_number }} not found in target repo."
          else
            gh pr close ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} || echo "⚠️ Could not close PR"
            echo "✅ PR close attempted in TARGET repo!"
          fi
      
      # ============================================================
      # STEP 4: Close PR in SOURCE repo (DEV)
      # ============================================================
      
      - name: Close PR in SOURCE repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔒 Attempting to close PR #${{ github.event.inputs.pr_number }} in SOURCE repo"
          
          # Check if PR exists in source repo
          PR_EXISTS=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.event.inputs.source_repo }} --json number 2>/dev/null || echo "not_found")
          
          if [[ "$PR_EXISTS" == "not_found" ]]; then
            echo "⚠️ PR #${{ github.event.inputs.pr_number }} not found in source repo."
          else
            gh pr close ${{ github.event.inputs.pr_number }} --repo ${{ github.event.inputs.source_repo }} || echo "⚠️ Could not close PR"
            echo "✅ PR close attempted in SOURCE repo!"
          fi
      
      # ============================================================
      # STEP 5: Log Success
      # ============================================================
      
      - name: Log success
        run: |
          echo "============================================"
          echo "✅ SYNC PROCESS COMPLETED!"
          echo "   - PR merge attempted in SOURCE repo"
          echo "   - Code sync attempted to TARGET repo"
          echo "   - PR close attempted in BOTH repos"
          echo "============================================"
      
      - name: Show final status
        run: |
          echo "📊 Final PR Status:"
          echo "SOURCE:"
          gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.event.inputs.source_repo }} --json state,merged 2>/dev/null || echo "PR not found"
          echo ""
          echo "TARGET:"
          gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --json state,merged 2>/dev/null || echo "PR not found"
